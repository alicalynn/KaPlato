<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Ionic App</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

  <!-- Content Security Policy for development -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' http: https: ws: wss:; connect-src 'self' localhost:* 127.0.0.1:* http://localhost:* http://127.0.0.1:* https://localhost:* https://127.0.0.1:* https://*.googleapis.com https://*.google.com https://*.ngrok.io wss://*; img-src 'self' data: https:; font-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.googleapis.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline';">

  <!-- Google Maps API - Add your API key here -->
  <!-- Get a free API key from: https://developers.google.com/maps/documentation/javascript/get-api-key -->
  <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD-1234567890-YOUR-KEY-HERE&libraries=places"></script>

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>

  <app-root></app-root>
</body>

</html>
