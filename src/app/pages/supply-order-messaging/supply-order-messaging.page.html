<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="dismissModal()">
        <ion-icon name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Conversation - Order #{{ orderId }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="clearConversation()" title="Clear conversation">
        <ion-icon name="trash-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="false" class="messaging-content">
  <div class="messages-container" #messageContainer>
    <div *ngIf="messages.length === 0" class="no-messages">
      <ion-icon name="chatbubbles-outline" size="large"></ion-icon>
      <p>No messages yet. Start the conversation!</p>
    </div>

    <div *ngFor="let message of messages" 
         [class.message-item]="true"
         [class.sent]="isSentByCurrentUser(message)"
         [class.received]="!isSentByCurrentUser(message)">
      <div class="message-bubble">
        <div class="message-sender" *ngIf="!isSentByCurrentUser(message)">
          {{ message.fromUser?.name || 'User' }}
        </div>
        <div class="message-text">{{ message.message }}</div>
        <div class="message-time">{{ message.created_at | date:'short' }}</div>
      </div>
    </div>
  </div>

  <div class="message-input-area">
    <input
      type="text"
      placeholder="Type a message..."
      [(ngModel)]="newMessage"
      (keyup.enter)="sendMessage()"
      [disabled]="isSendingMessage"
      class="message-input"
    >
    <button
      (click)="sendMessage()"
      [disabled]="!newMessage.trim() || isSendingMessage"
      class="send-btn"
      type="button"
    >
      <ion-icon *ngIf="!isSendingMessage" name="send-outline"></ion-icon>
      <ion-spinner *ngIf="isSendingMessage" name="dots"></ion-spinner>
    </button>
  </div>
</ion-content>
